services:
  vault-init-unseal:
    image: monadiam-infrastructure-cli:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: cli
    user: "0:0"
    container_name: vault-init-unseal
    env_file:
      - ../.env
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_INIT_DIR: /vault/init
    volumes:
      - vault_init:/vault/init
    command: ["vault", "initialize", "--env-file="]
    networks:
      vault_net:

  vault-bootstrap:
    image: monadiam-infrastructure-cli:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: cli
    user: "0:0"
    container_name: vault-bootstrap
    env_file:
      - ../.env
    depends_on:
      vault-init-unseal:
        condition: service_completed_successfully
      template-postgresql:
        condition: service_healthy
      organization-postgresql:
        condition: service_healthy
      hr-postgresql:
        condition: service_healthy
      identity-postgresql:
        condition: service_healthy
      access-control-postgresql:
        condition: service_healthy
      notification-postgresql:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_INIT_DIR: /vault/init
      VAULT_POLICIES_DIR: /vault/policies
    volumes:
      - ./policies:/vault/policies:ro
      - vault_init:/vault/init
    entrypoint: ["sh", "-ec"]
    command:
      - infra vault exec --env-file= -- make -f terraform/Makefile ROOT=vault apply; exec infra vault bootstrap --env-file=
    networks:
      vault_net:
      postgres_net:

volumes:
  vault_init:
    external: true
    name: ${COMPOSE_PROJECT_NAME:?}_vault_init

networks:
  vault_net:
    external: true
    name: ${DOCKER_NETWORK_VAULT:?}
  postgres_net:
    name: ${DOCKER_NETWORK_POSTGRES:?}
