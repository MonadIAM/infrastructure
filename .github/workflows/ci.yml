name: CI

on:
  pull_request:
    branches: [dev, local]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GOFLAGS: -mod=readonly

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Scan current files for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.29.0 \
            dir /repo --config /repo/.gitleaks.toml --redact

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        run: |
          mkdir -p "$HOME/.local/bin"
          release=https://github.com/casey/just/releases/download/1.59.0
          archive=just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL "$release/$archive" -o /tmp/just.tar.gz
          curl -fsSL "$release/SHA256SUMS" -o /tmp/just-SHA256SUMS
          grep " $archive$" /tmp/just-SHA256SUMS |
            sed "s@ $archive@ /tmp/just.tar.gz@" |
            sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l main.go cli)"

      - name: Lint
        run: just cli::lint

      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Check workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  configuration:
    name: Infrastructure configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        run: |
          mkdir -p "$HOME/.local/bin"
          release=https://github.com/casey/just/releases/download/1.59.0
          archive=just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL "$release/$archive" -o /tmp/just.tar.gz
          curl -fsSL "$release/SHA256SUMS" -o /tmp/just-SHA256SUMS
          grep " $archive$" /tmp/just-SHA256SUMS |
            sed "s@ $archive@ /tmp/just.tar.gz@" |
            sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v4.2.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e
        with:
          version: v1.35.5

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      - name: Validate environment configuration
        run: just env::check .env.dev.example

      - name: Validate Kubernetes configuration
        run: just k8::validate

  terraform:
    name: Terraform (${{ matrix.root }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, gateway, gitops, gitops-apps, istio, observability, operators, redis, seaweedfs, storage, vault, vault-operator, vault-server]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check terraform/${{ matrix.root }}

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/terraform-providers
          key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ matrix.root }}-${{ hashFiles(format('terraform/{0}/.terraform.lock.hcl', matrix.root)) }}

      - name: Initialize and validate Terraform
        env:
          TF_IN_AUTOMATION: "1"
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-providers
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir=terraform/${{ matrix.root }} init -backend=false -input=false -lockfile=readonly -no-color
          terraform -chdir=terraform/${{ matrix.root }} validate -no-color

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: go build -trimpath -o "$RUNNER_TEMP/infra" .

      - name: Check CLI entrypoint
        run: '"$RUNNER_TEMP/infra" --help'

  ci:
    name: CI passed
    if: ${{ always() }}
    needs: [gitleaks, static-analysis, configuration, terraform, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every check to pass
        env:
          PASSED: ${{ needs.gitleaks.result == 'success' && needs.static-analysis.result == 'success' && needs.configuration.result == 'success' && needs.build.result == 'success' }}
        run: test "$PASSED" = true
