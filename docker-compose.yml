x-base: &base
  restart: on-failure

name: infra

services:
  kafka:
    <<: *base
    image: ${KAFKA_IMAGE:?}
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT},EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT},CONTROLLER://kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT},EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:?}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:?}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:?}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      kafka_net:
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: ${KAFKA_IMAGE:?}
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["bash", "/init-topics.sh"]
    networks:
      kafka_net:

  kafka-ui:
    <<: *base
    image: ${KAFKA_UI_IMAGE:?}
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_INTERNAL_PORT}
    networks:
      kafka_net:

  vault:
    <<: *base
    image: ${VAULT_IMAGE:?}
    container_name: vault
    environment:
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:${VAULT_PORT}"
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
    command: server -dev
    ports:
      - "${VAULT_PUBLISHED_PORT}:${VAULT_PORT}"
    cap_add:
      - IPC_LOCK
    networks:
      vault_net:
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:${VAULT_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  vault-init:
    image: ${VAULT_IMAGE:?}
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    env_file:
      - .env
      - .vault.env
    environment:
      VAULT_ADDR: "http://vault:${VAULT_PORT}"
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
    volumes:
      - ./infrastructure/vault/secrets-policy.hcl:/secrets-policy.hcl:ro
      - ./infrastructure/vault/init.sh:/init.sh:ro
      - vault_secrets_token:/vault/token
    entrypoint: ["sh", "/init.sh"]
    networks:
      vault_net:

  vault-secrets-init:
    image: ${VAULT_IMAGE:?}
    container_name: vault-secrets-init
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "http://vault:${VAULT_PORT}"
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:?}
      VAULT_KV_CLICKHOUSE_PATH: ${VAULT_KV_CLICKHOUSE_PATH:?}
    volumes:
      - ./infrastructure/vault/render-secrets.sh:/render-secrets.sh:ro
      - vault_secrets_token:/vault/token
      - clickhouse_secrets:/secrets
    entrypoint: ["sh", "/render-secrets.sh"]
    networks:
      vault_net:

  clickhouse:
    <<: *base
    image: ${CLICKHOUSE_IMAGE:?}
    container_name: clickhouse
    depends_on:
      vault-secrets-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT:?}
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_secrets:/vault/secrets:ro
      - ./infrastructure/clickhouse/entrypoint.sh:/entrypoint-wrapper.sh:ro
    entrypoint: ["sh", "/entrypoint-wrapper.sh"]
    networks:
      kafka_net:
      monitoring_net:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$(cat /vault/secrets/clickhouse_password)\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse-init:
    image: ${CLICKHOUSE_IMAGE:?}
    container_name: clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
      CLICKHOUSE_WRITER_USER: ${CLICKHOUSE_WRITER_USER:?}
      CLICKHOUSE_READER_USER: ${CLICKHOUSE_READER_USER:?}
    volumes:
      - ./infrastructure/clickhouse/init.sh:/init.sh:ro
      - ./infrastructure/clickhouse/schema:/schema:ro
      - clickhouse_secrets:/vault/secrets:ro
    entrypoint: ["bash", "/init.sh"]
    networks:
      kafka_net:

  grafana:
    <<: *base
    image: ${GRAFANA_IMAGE:?}
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ORG_NAME=${GF_AUTH_ANONYMOUS_ORG_NAME}
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      monitoring_net:
      kafka_net:

  prom-access-control:
    <<: *base
    image: ${PROMETHEUS_IMAGE:?}
    container_name: prom-access-control
    ports:
      - "${PROMETHEUS_ACCESS_CONTROL_PORT}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/access-control.yml:/etc/prometheus/prometheus.yml
      - prom_access_control_data:/prometheus
    networks:
      monitoring_net:

  loki-access-control:
    <<: *base
    image: ${LOKI_IMAGE:?}
    container_name: loki-access-control
    ports:
      - "${LOKI_ACCESS_CONTROL_PORT}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_access_control_data:/loki
    networks:
      monitoring_net:

  prom-identity:
    <<: *base
    image: ${PROMETHEUS_IMAGE:?}
    container_name: prom-identity
    ports:
      - "${PROMETHEUS_IDENTITY_PORT}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/identity.yml:/etc/prometheus/prometheus.yml
      - prom_identity_data:/prometheus
    networks:
      monitoring_net:

  loki-identity:
    <<: *base
    image: ${LOKI_IMAGE:?}
    container_name: loki-identity
    ports:
      - "${LOKI_IDENTITY_PORT}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_identity_data:/loki
    networks:
      monitoring_net:

volumes:
  kafka_data:
  vault_secrets_token:
  clickhouse_data:
  clickhouse_secrets:
  grafana_data:
  prom_access_control_data:
  prom_identity_data:
  loki_access_control_data:
  loki_identity_data:

networks:
  monitoring_net:
    external: true
    name: ${DOCKER_NETWORK_MONITORING}
  kafka_net:
    external: true
    name: ${DOCKER_NETWORK_KAFKA}
  vault_net:
    external: true
    name: ${DOCKER_NETWORK_VAULT}
