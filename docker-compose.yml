x-base: &base
  restart: on-failure

name: infra

services:
  consul-envoy-image:
    build:
      context: ./infrastructure/consul/envoy
      args:
        CONSUL_IMAGE: ${CONSUL_IMAGE:?}
        ENVOY_IMAGE: ${ENVOY_IMAGE:?}
    image: ${CONSUL_ENVOY_IMAGE:?}
    profiles:
      - build
    command: ["--version"]

  consul:
    <<: *base
    image: ${CONSUL_IMAGE:?}
    container_name: consul
    command: agent -config-file=/consul/config/consul.hcl
    ports:
      - "${CONSUL_UI_PORT}:8500"
    volumes:
      - ./infrastructure/consul/consul.hcl:/consul/config/consul.hcl:ro
      - vault_ca:/vault/tls:ro
      - consul_data:/consul/data
    networks:
      consul_net:
      vault_net:
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  consul-connect-ca:
    image: ${CONSUL_IMAGE:?}
    container_name: consul-connect-ca
    depends_on:
      consul:
        condition: service_healthy
      terraform-apply:
        condition: service_completed_successfully
    environment:
      CONSUL_HTTP_ADDR: "http://consul:8500"
      VAULT_ADDR: "https://vault:${VAULT_PORT}"
      VAULT_TOKEN_FILE: /terraform-output/consul-connect-ca-token
      VAULT_CACERT: /vault/tls/ca.crt
    volumes:
      - ./infrastructure/consul/connect-ca-config.sh:/connect-ca-config.sh:ro
      - ./infrastructure/terraform/.output:/terraform-output:ro
      - vault_ca:/vault/tls:ro
    entrypoint: ["sh", "/connect-ca-config.sh"]
    networks:
      consul_net:
      vault_net:

  consul-intentions:
    image: ${CONSUL_IMAGE:?}
    container_name: consul-intentions
    depends_on:
      consul:
        condition: service_healthy
      consul-connect-ca:
        condition: service_completed_successfully
    environment:
      CONSUL_HTTP_ADDR: "http://consul:8500"
    volumes:
      - ./infrastructure/consul/intentions.sh:/intentions.sh:ro
    entrypoint: ["sh", "/intentions.sh"]
    networks:
      consul_net:

  vault-tls:
    image: ${VAULT_TLS_IMAGE:?}
    container_name: vault-tls
    environment:
      CERT_DIR: /vault/tls
      CA_DIR: /vault/ca
      DAYS: "3650"
    entrypoint: ["sh", "/generate-tls.sh"]
    volumes:
      - ./infrastructure/vault/generate-tls.sh:/generate-tls.sh:ro
      - ./infrastructure/vault/tls:/vault/tls
      - vault_ca:/vault/ca

  vault:
    <<: *base
    image: ${VAULT_IMAGE:?}
    container_name: vault
    depends_on:
      vault-tls:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://127.0.0.1:${VAULT_PORT}"
      VAULT_CACERT: /vault/tls/ca.crt
    command: server -config=/vault/vault.hcl
    ports:
      - "${VAULT_PUBLISHED_PORT}:${VAULT_PORT}"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./infrastructure/vault/vault.hcl:/vault/vault.hcl:ro
      - ./infrastructure/vault/tls:/vault/tls:ro
      - service_tls_ca:/service/ca:ro
      - vault_data:/vault/file
    networks:
      vault_net:
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

  vault-init-unseal:
    image: ${VAULT_IMAGE:?}
    container_name: vault-init-unseal
    restart: always
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: "https://vault:${VAULT_PORT}"
      VAULT_CACERT: /vault/tls/ca.crt
      VAULT_INIT_KEYS_DIR: /vault/init-keys
    volumes:
      - ./infrastructure/vault/init-unseal.sh:/init-unseal.sh:ro
      - vault_ca:/vault/tls:ro
      - ./infrastructure/vault/init-keys:/vault/init-keys
    entrypoint: ["sh", "/init-unseal.sh"]
    networks:
      vault_net:
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 5s

  terraform-apply:
    image: ${TERRAFORM_IMAGE:?}
    container_name: terraform-apply
    depends_on:
      vault-init-unseal:
        condition: service_healthy
    environment:
      TF_VAR_vault_address: "https://vault:${VAULT_PORT}"
      VAULT_ADDR: "https://vault:${VAULT_PORT}"
      VAULT_CACERT: /vault/tls/ca.crt
      VAULT_ROOT_TOKEN_FILE: /vault/init-keys/root-token
      TERRAFORM_OUTPUT_DIR: /workspace/.output
      TF_VAR_notification_aws_root_secret_access_key: ${AWS_ROOT_SECRET_ACCESS_KEY:?}
      TF_VAR_identity_oauth_google_client_secret: ${OAUTH_GOOGLE_CLIENT_SECRET:?}
      TF_VAR_identity_oauth_github_client_secret: ${OAUTH_GITHUB_CLIENT_SECRET:?}
      TF_VAR_notification_aws_root_access_key_id: ${AWS_ROOT_ACCESS_KEY_ID:?}
    entrypoint: ["sh", "/terraform-apply.sh"]
    volumes:
      - ./infrastructure/vault/terraform-apply.sh:/terraform-apply.sh:ro
      - ./infrastructure/vault/init-keys:/vault/init-keys:ro
      - ./infrastructure/terraform:/workspace
      - vault_ca:/vault/tls:ro
    networks:
      vault_net:

  service-tls:
    image: ${VAULT_IMAGE:?}
    container_name: service-tls
    group_add:
      - "10000"
    depends_on:
      terraform-apply:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://vault:${VAULT_PORT}"
      VAULT_CACERT: /vault/tls/ca.crt
      SERVICE_CERT_DIR: /service/tls
      SERVICE_CA_DIR: /service/ca
      VAULT_TOKEN_FILE: /terraform-output/service-tls-issuer-token
      SERVICE_CA_BUNDLE_FILE: /terraform-output/service-tls-ca.crt
      PKI_MOUNT: pki-service
      TLS_TTL: 8760h
    volumes:
      - ./infrastructure/vault/generate-service-tls.sh:/generate-service-tls.sh:ro
      - ./infrastructure/terraform/.output:/terraform-output:ro
      - service_tls_ca:/service/ca
      - service_tls:/service/tls
      - vault_ca:/vault/tls:ro
    entrypoint: ["sh", "/generate-service-tls.sh"]
    networks:
      vault_net:

  vault-bootstrap:
    image: ${VAULT_IMAGE:?}
    container_name: vault-bootstrap
    depends_on:
      terraform-apply:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://vault:${VAULT_PORT}"
      VAULT_CACERT: /vault/tls/ca.crt
      VAULT_BOOTSTRAP_TOKEN_FILE: /terraform-output/infra-agent-bootstrap-token
      VAULT_AGENT_ROLE_NAME: infra
      VAULT_AGENT_ROLE_ID_FILE: /vault/config/role-id
      VAULT_AGENT_SECRET_ID_FILE: /vault/agent-bootstrap/secret-id
    volumes:
      - ./infrastructure/terraform/.output:/terraform-output:ro
      - ./infrastructure/vault/bootstrap.sh:/bootstrap.sh:ro
      - vault_agent_bootstrap:/vault/agent-bootstrap
      - vault_agent_config:/vault/config
      - vault_ca:/vault/tls:ro
    entrypoint: ["sh", "/bootstrap.sh"]
    networks:
      vault_net:

  vault-agent:
    image: ${VAULT_IMAGE:?}
    container_name: vault-agent
    restart: always
    group_add:
      - "10000"
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://vault:${VAULT_PORT}"
      VAULT_CACERT: /vault/tls/ca.crt
    entrypoint: ["vault"]
    command: ["agent", "-config=/agent.hcl"]
    volumes:
      - ./infrastructure/vault/agent.hcl:/agent.hcl:ro
      - vault_ca:/vault/tls:ro
      - vault_agent_config:/vault/config:ro
      - vault_agent_bootstrap:/vault/agent-bootstrap
      - vault_agent_token:/vault/token
      - identity_postgresql_secrets:/secrets/postgresql/identity
      - access_control_postgresql_secrets:/secrets/postgresql/access-control
      - notification_postgresql_secrets:/secrets/postgresql/notification
      - identity_redis_secrets:/secrets/redis/identity
      - access_control_redis_secrets:/secrets/redis/access-control
      - notification_redis_secrets:/secrets/redis/notification
      - clickhouse_secrets:/secrets/clickhouse
      - minio_secrets:/secrets/minio
      - grafana_secrets:/secrets/grafana
      - kafka_secrets:/secrets/kafka
    networks:
      vault_net:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /secrets/postgresql/identity/postgresql_password && test -f /secrets/postgresql/identity/postgresql_replication_password && test -f /secrets/postgresql/access-control/postgresql_password && test -f /secrets/postgresql/access-control/postgresql_replication_password && test -f /secrets/postgresql/notification/postgresql_password && test -f /secrets/postgresql/notification/postgresql_replication_password && test -f /secrets/redis/identity/redis_password && test -f /secrets/redis/access-control/redis_password && test -f /secrets/redis/notification/redis_password && test -f /secrets/clickhouse/clickhouse_password && test -f /secrets/clickhouse/kafka_sasl_password && test -f /secrets/minio/minio_root_password && test -f /secrets/grafana/admin_password && test -f /secrets/kafka/kafka_broker_sasl_password && test -f /secrets/kafka/kafka_admin_sasl_password && test -f /secrets/kafka/kafka_connect_sasl_password && test -f /secrets/kafka/kafka_ui_sasl_password && test -f /secrets/kafka/kafka_ui_admin_password && test -f /secrets/kafka/kafka_clickhouse_sasl_password && test -f /secrets/kafka/kafka-ui.yml && test -f /secrets/kafka/identity/kafka_sasl_password && test -f /secrets/kafka/access-control/kafka_sasl_password && test -f /secrets/kafka/notification/kafka_sasl_password",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  vault_data:
  service_tls:
    name: ${DOCKER_VOLUME_SERVICE_TLS:?}
  vault_ca:
    name: ${DOCKER_VOLUME_VAULT_CA:?}
  service_tls_ca:
    name: service_tls_ca
  access_control_postgresql_secrets:
  notification_postgresql_secrets:
  access_control_redis_secrets:
  identity_postgresql_secrets:
  notification_redis_secrets:
  identity_redis_secrets:
  vault_agent_bootstrap:
  vault_agent_config:
  clickhouse_secrets:
  vault_agent_token:
  grafana_secrets:
  kafka_secrets:
  minio_secrets:
  consul_data:

networks:
  vault_net:
    external: true
    name: ${DOCKER_NETWORK_VAULT}
  consul_net:
    external: true
    name: ${DOCKER_NETWORK_CONSUL}
