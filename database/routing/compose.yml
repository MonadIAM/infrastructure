x-base: &base
  restart: on-failure

services:
  postgres-haproxy:
    <<: *base
    build:
      context: ./haproxy
      args:
        HAPROXY_BASE_IMAGE: ${HAPROXY_IMAGE:?}
    container_name: postgres-haproxy
    env_file:
      - ../../.env
    command:
      - "-consul-addr=consul:8500"
      - "-template=/etc/haproxy-templates/haproxy.ctmpl:/usr/local/etc/haproxy/haproxy.cfg"
      - "-exec=haproxy -f /usr/local/etc/haproxy/haproxy.cfg -db"
    depends_on:
      consul:
        condition: service_healthy
    networks:
      postgres_net:
      consul_net:
      vault_net:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  pgbouncer-write:
    <<: *base
    build:
      context: ./pgbouncer
      args:
        PGBOUNCER_BASE_IMAGE: ${PGBOUNCER_BASE_IMAGE:?}
    container_name: pgbouncer-write
    env_file:
      - ../../.env
    environment:
      IDENTITY_POSTGRES_TARGET_PORT: ${IDENTITY_POSTGRES_WRITE_PORT:?}
      ACCESS_CONTROL_POSTGRES_TARGET_PORT: ${ACCESS_CONTROL_POSTGRES_WRITE_PORT:?}
      NOTIFICATION_POSTGRES_TARGET_PORT: ${NOTIFICATION_POSTGRES_WRITE_PORT:?}
    ports:
      - "127.0.0.1:${PGBOUNCER_WRITE_PUBLISHED_PORT}:${PGBOUNCER_LISTEN_PORT}"
    depends_on:
      service-tls:
        condition: service_completed_successfully
      postgres-haproxy:
        condition: service_healthy
      vault-agent:
        condition: service_healthy
    volumes:
      - identity_postgresql_secrets:/secrets/identity:ro
      - access_control_postgresql_secrets:/secrets/access-control:ro
      - notification_postgresql_secrets:/secrets/notification:ro
      - service_tls:/tls:ro
    networks:
      postgres_net:
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${PGBOUNCER_LISTEN_PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgbouncer-read:
    <<: *base
    build:
      context: ./pgbouncer
      args:
        PGBOUNCER_BASE_IMAGE: ${PGBOUNCER_BASE_IMAGE:?}
    container_name: pgbouncer-read
    env_file:
      - ../../.env
    environment:
      IDENTITY_POSTGRES_TARGET_PORT: ${IDENTITY_POSTGRES_READ_PORT:?}
      ACCESS_CONTROL_POSTGRES_TARGET_PORT: ${ACCESS_CONTROL_POSTGRES_READ_PORT:?}
      NOTIFICATION_POSTGRES_TARGET_PORT: ${NOTIFICATION_POSTGRES_READ_PORT:?}
    ports:
      - "127.0.0.1:${PGBOUNCER_READ_PUBLISHED_PORT}:${PGBOUNCER_LISTEN_PORT}"
    depends_on:
      service-tls:
        condition: service_completed_successfully
      postgres-haproxy:
        condition: service_healthy
      vault-agent:
        condition: service_healthy
    volumes:
      - identity_postgresql_secrets:/secrets/identity:ro
      - access_control_postgresql_secrets:/secrets/access-control:ro
      - notification_postgresql_secrets:/secrets/notification:ro
      - service_tls:/tls:ro
    networks:
      postgres_net:
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${PGBOUNCER_LISTEN_PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  identity_postgresql_secrets:
  access_control_postgresql_secrets:
  notification_postgresql_secrets:
  service_tls:
    name: ${DOCKER_VOLUME_SERVICE_TLS:?}

networks:
  postgres_net:
    name: ${DOCKER_NETWORK_POSTGRES}
    internal: true
  consul_net:
    external: true
    name: ${DOCKER_NETWORK_CONSUL}
  vault_net:
    external: true
    name: ${DOCKER_NETWORK_VAULT}
