x-base: &base
  restart: on-failure

services:
  access-control-redis:
    <<: *base
    image: ${REDIS_IMAGE:?}
    container_name: access-control-redis
    depends_on:
      service-tls:
        condition: service_completed_successfully
      vault-agent:
        condition: service_healthy
    environment:
      REDIS_PORT: ${REDIS_PORT:?}
    ports:
      - "127.0.0.1:${ACCESS_CONTROL_REDIS_PUBLISHED_PORT}:${REDIS_PORT}"
    volumes:
      - access_control_redis_data:/data
      - access_control_redis_secrets:/vault/secrets:ro
      - service_tls:/tls:ro
      - ../../database/redis/entrypoint.sh:/usr/local/bin/vault-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/vault-entrypoint.sh"]
    networks:
      redis_net:
        aliases:
          - access-control-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /tmp/redis-tls/ca.crt --cert /tmp/redis-tls/client.crt --key /tmp/redis-tls/client.key -p $${REDIS_PORT:?} -a \"$$(cat /vault/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  access-control-postgresql:
    <<: *base
    build:
      context: ../../database/postgres
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_IMAGE:?}
    env_file:
      - ../../.env
    environment:
      PATRONI_SCOPE: access-control-service
      POSTGRES_DB: ${ACCESS_CONTROL_POSTGRES_DB:?}
      POSTGRES_USER: ${ACCESS_CONTROL_POSTGRES_USER:?}
      POSTGRES_REPLICATION_USER: ${ACCESS_CONTROL_POSTGRES_REPLICATION_USER:?}
      POSTGRES_OUTBOX_SLOT: ${ACCESS_CONTROL_POSTGRES_OUTBOX_SLOT:?}
    depends_on:
      service-tls:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
      vault-agent:
        condition: service_healthy
    volumes:
      - /var/lib/postgresql/data
      - access_control_postgresql_secrets:/vault/secrets:ro
      - service_tls:/tls:ro
    networks:
      postgres_net:
      consul_net:
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  access-control-postgres-haproxy:
    <<: *base
    build:
      context: ../../database/postgres-haproxy
      args:
        HAPROXY_BASE_IMAGE: ${HAPROXY_IMAGE:?}
    container_name: access-control-postgres-haproxy
    env_file:
      - ../../.env
    environment:
      PATRONI_SCOPE: access-control-service
    command:
      - "-consul-addr=consul:8500"
      - "-template=/etc/haproxy-templates/haproxy.ctmpl:/usr/local/etc/haproxy/haproxy.cfg"
      - "-exec=haproxy -f /usr/local/etc/haproxy/haproxy.cfg -db"
    depends_on:
      consul:
        condition: service_healthy
    networks:
      postgres_net:
      consul_net:
      vault_net:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7000/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

volumes:
  access_control_postgresql_secrets:
  access_control_redis_secrets:
  access_control_redis_data:
  service_tls:
    name: ${DOCKER_VOLUME_SERVICE_TLS:?}

networks:
  postgres_net:
    name: ${DOCKER_NETWORK_POSTGRES}
    internal: true
  redis_net:
    name: ${DOCKER_NETWORK_REDIS}
    internal: true
  consul_net:
    external: true
    name: ${DOCKER_NETWORK_CONSUL}
  vault_net:
    external: true
    name: ${DOCKER_NETWORK_VAULT}
