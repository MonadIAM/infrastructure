x-base: &base
  restart: on-failure
  env_file:
    - ../.env

services:
  clickhouse:
    <<: *base
    image: ${CLICKHOUSE_IMAGE:?}
    container_name: clickhouse
    ports:
      - "${CLICKHOUSE_NATIVE_PORT:?}:9000"
      - "${CLICKHOUSE_HTTP_PORT:?}:8123"
    volumes:
      - ./clickhouse/config/local-ports.xml:/etc/clickhouse-server/config.d/local-ports.xml:ro
      - ./clickhouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - clickhouse_data:/var/lib/clickhouse
    networks:
      monitoring_net:
        aliases:
          - clickhouse
      kafka_net:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --port 9000 --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse-init:
    image: monadiam-infrastructure-cli:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: cli
    container_name: clickhouse-init
    env_file:
      - ../.env
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./clickhouse/schema:/schema:ro
    environment:
      CLICKHOUSE_SCHEMA_DIR: /schema
    command: ["clickhouse", "reconcile", "--env-file="]
    networks:
      kafka_net:

  seaweedfs:
    restart: on-failure
    image: monadiam-infrastructure-seaweedfs:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: seaweedfs-runtime
      args:
        SEAWEEDFS_IMAGE: ${SEAWEEDFS_IMAGE:?}
    env_file:
      - ../.env
    environment:
      SEAWEEDFS_ADMIN_ACCESS_KEY: ${SEAWEEDFS_ADMIN_ACCESS_KEY:?}
      SEAWEEDFS_ADMIN_SECRET_KEY: ${SEAWEEDFS_ADMIN_SECRET_KEY:?}
      SEAWEEDFS_ARCHIVER_ACCESS_KEY: ${SEAWEEDFS_ARCHIVER_ACCESS_KEY:?}
      SEAWEEDFS_ARCHIVER_SECRET_KEY: ${SEAWEEDFS_ARCHIVER_SECRET_KEY:?}
      SEAWEEDFS_AUDIT_LOG_BUCKET: ${SEAWEEDFS_AUDIT_LOG_BUCKET:?}
      SEAWEEDFS_CHANGE_LOG_BUCKET: ${SEAWEEDFS_CHANGE_LOG_BUCKET:?}
    command:
      - seaweedfs
      - start
      - --env-file=
      - --
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3.config=/tmp/credentials.json
      - -s3.port=${SEAWEEDFS_API_INTERNAL_PORT:?}
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -webdav=false
      - -admin.ui=true
      - -admin.port=${SEAWEEDFS_ADMIN_INTERNAL_PORT:?}
      - -filer.exposeDirectoryData=false
      - -master.telemetry=false
      - -master.port=${SEAWEEDFS_MASTER_INTERNAL_PORT:?}
      - -metricsPort=${SEAWEEDFS_METRICS_INTERNAL_PORT:?}
    ports:
      - "127.0.0.1:${SEAWEEDFS_API_PORT:?}:${SEAWEEDFS_API_INTERNAL_PORT:?}"
      - "127.0.0.1:${SEAWEEDFS_ADMIN_PORT:?}:${SEAWEEDFS_ADMIN_INTERNAL_PORT:?}"
    volumes:
      - seaweedfs_data:/data
    networks:
      monitoring_net:
      kafka_net:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${SEAWEEDFS_MASTER_INTERNAL_PORT:?}/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  seaweedfs-init:
    image: monadiam-infrastructure-cli:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: cli
    env_file:
      - ../.env
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      SEAWEEDFS_CONFIG_DIR: /config
    command: ["seaweedfs", "reconcile", "--env-file="]
    volumes:
      - ./seaweedfs:/config:ro
    networks:
      kafka_net:

  clickhouse-archiver:
    <<: *base
    image: monadiam-infrastructure-cli:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: cli
    container_name: clickhouse-archiver
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    command: ["archive", "loop", "--env-file="]
    networks:
      kafka_net:

volumes:
  clickhouse_data:
  seaweedfs_data:

networks:
  monitoring_net:
    name: ${DOCKER_NETWORK_MONITORING:?}
  kafka_net:
    name: ${DOCKER_NETWORK_KAFKA:?}
