x-base: &base
  restart: on-failure

services:
  clickhouse:
    <<: *base
    image: ${CLICKHOUSE_IMAGE:?}
    container_name: clickhouse
    depends_on:
      service-tls:
        condition: service_completed_successfully
      vault-agent:
        condition: service_healthy
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT:?}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?}
    ports:
      - "${CLICKHOUSE_NATIVE_PORT:?}:${CLICKHOUSE_NATIVE_INTERNAL_PORT:?}"
      - "${CLICKHOUSE_HTTP_PORT:?}:${CLICKHOUSE_HTTP_INTERNAL_PORT:?}"
    volumes:
      - ./clickhouse/entrypoint.sh:/entrypoint-wrapper.sh:ro
      - clickhouse_secrets:/vault/secrets:ro
      - clickhouse_data:/var/lib/clickhouse
      - service_tls:/tls:ro
    entrypoint: ["sh", "/entrypoint-wrapper.sh"]
    networks:
      kafka_net:
      monitoring_net:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$(cat /vault/secrets/clickhouse_password)\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse-init:
    image: ${CLICKHOUSE_IMAGE:?}
    container_name: clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_WRITER_USER: ${CLICKHOUSE_WRITER_USER:?}
      CLICKHOUSE_READER_USER: ${CLICKHOUSE_READER_USER:?}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
    volumes:
      - clickhouse_secrets:/vault/secrets:ro
      - ./clickhouse/init.sh:/init.sh:ro
      - ./clickhouse/schema:/schema:ro
    entrypoint: ["bash", "/init.sh"]
    networks:
      kafka_net:

  minio:
    <<: *base
    image: ${MINIO_IMAGE:?}
    container_name: minio
    depends_on:
      vault-agent:
        condition: service_healthy
    environment:
      MINIO_ROOT_PASSWORD_FILE: /vault/secrets/minio_root_password
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
    command: server /data --address ":${MINIO_API_INTERNAL_PORT:?}" --console-address ":${MINIO_CONSOLE_INTERNAL_PORT:?}"
    ports:
      - "${MINIO_CONSOLE_PORT:?}:${MINIO_CONSOLE_INTERNAL_PORT:?}"
      - "${MINIO_API_PORT:?}:${MINIO_API_INTERNAL_PORT:?}"
    volumes:
      - minio_secrets:/vault/secrets:ro
      - minio_data:/data
    networks:
      kafka_net:

  minio-init:
    image: ${MINIO_MC_IMAGE:?}
    container_name: minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_CHANGE_LOG_RETENTION_DAYS: ${MINIO_CHANGE_LOG_RETENTION_DAYS:?}
      MINIO_AUDIT_LOG_RETENTION_DAYS: ${MINIO_AUDIT_LOG_RETENTION_DAYS:?}
      MINIO_ARCHIVER_ACCESS_KEY: ${MINIO_ARCHIVER_ACCESS_KEY:?}
      MINIO_CHANGE_LOG_BUCKET: ${MINIO_CHANGE_LOG_BUCKET:?}
      MINIO_API_INTERNAL_PORT: ${MINIO_API_INTERNAL_PORT:?}
      MINIO_AUDIT_LOG_BUCKET: ${MINIO_AUDIT_LOG_BUCKET:?}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
    volumes:
      - minio_secrets:/vault/secrets:ro
      - ./minio/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    networks:
      kafka_net:

  clickhouse-archiver:
    <<: *base
    image: ${CLICKHOUSE_IMAGE:?}
    container_name: clickhouse-archiver
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_ARCHIVER_ACCESS_KEY: ${MINIO_ARCHIVER_ACCESS_KEY:?}
      ARCHIVE_INTERVAL_SECONDS: ${ARCHIVE_INTERVAL_SECONDS:?}
      MINIO_CHANGE_LOG_BUCKET: ${MINIO_CHANGE_LOG_BUCKET:?}
      MINIO_API_INTERNAL_PORT: ${MINIO_API_INTERNAL_PORT:?}
      MINIO_AUDIT_LOG_BUCKET: ${MINIO_AUDIT_LOG_BUCKET:?}
      CLICKHOUSE_WRITER_USER: ${CLICKHOUSE_WRITER_USER:?}
      ARCHIVE_AFTER_DAYS: ${ARCHIVE_AFTER_DAYS:?}
    volumes:
      - clickhouse_secrets:/vault/secrets/clickhouse:ro
      - ./archiver/entrypoint.sh:/entrypoint.sh:ro
      - minio_secrets:/vault/secrets/minio:ro
      - ./archiver/archive.sh:/archive.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    networks:
      kafka_net:

volumes:
  service_tls:
    name: ${DOCKER_VOLUME_SERVICE_TLS:?}
  clickhouse_secrets:
  clickhouse_data:
  minio_secrets:
  minio_data:

networks:
  monitoring_net:
    external: true
    name: ${DOCKER_NETWORK_MONITORING:?}
  kafka_net:
    external: true
    name: ${DOCKER_NETWORK_KAFKA:?}
