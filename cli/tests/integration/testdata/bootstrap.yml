services:
  kafka:
    image: monadiam-infrastructure-kafka:local
    build:
      context: ../../../..
      target: kafka-runtime
      args:
        KAFKA_IMAGE: ${KAFKA_IMAGE:?}
    environment:
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    command: ["kafka", "start", "--env-file="]
    volumes:
      - ../../../../messaging/kafka/server.properties:/etc/kafka/server.properties:ro
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  vault:
    image: ${VAULT_IMAGE:?}
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    volumes:
      - ../../../../vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 2s
      timeout: 3s
      retries: 40

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?}
    environment:
      CLICKHOUSE_DB: audit
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: test-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1::8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password test-only --query 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  seaweedfs:
    image: monadiam-infrastructure-seaweedfs:local
    build:
      context: ../../../..
      target: seaweedfs-runtime
      args:
        SEAWEEDFS_IMAGE: ${SEAWEEDFS_IMAGE:?}
    env_file:
      - ../../../../.env.example
    command: ["seaweedfs", "start", "--env-file=", "--", "mini", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-s3.config=/tmp/credentials.json", "-s3.port=8333", "-s3.port.iceberg=0", "-s3.port.lance=0", "-s3.autoCreateBucket=false", "-s3.allowDeleteBucketNotEmpty=false", "-webdav=false", "-admin.ui=false", "-filer.exposeDirectoryData=false", "-master.telemetry=false"]
    ports:
      - "127.0.0.1::8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 40

  cli:
    profiles: [tools]
    image: monadiam-infrastructure-cli:local
    build:
      context: ../../../..
      target: cli
    user: "0:0"
    env_file:
      - ../../../../.env.example
    environment:
      CLICKHOUSE_PASSWORD: test-only
      CLICKHOUSE_WRITER_PASSWORD: "test-only'writer"
      CLICKHOUSE_READER_PASSWORD: test-only-reader
      CLICKHOUSE_SCHEMA_DIR: /schema
      SEAWEEDFS_CONFIG_DIR: /config
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: integration-local-token
      VAULT_INIT_DIR: /vault/init
      VAULT_POLICIES_DIR: /vault/policies
    volumes:
      - ../../../../audit-archive/clickhouse/schema:/schema:ro
      - ../../../../audit-archive/seaweedfs:/config:ro
      - ../../../../vault/policies:/vault/policies:ro
      - vault-init:/vault/init

volumes:
  kafka-data:
  vault-data:
  vault-init:
  clickhouse-data:
  seaweedfs-data:
