global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: otel-metrics
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: monadiam-services
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - template-service-app:4000
        labels:
          service: template-service
      - targets:
          - organization-service-app:4004
        labels:
          service: organization-service
      - targets:
          - hr-service-app:4005
        labels:
          service: hr-service
      - targets:
          - access-control-service-app:4001
        labels:
          service: access-control-service
      - targets:
          - identity-service-app:4002
        labels:
          service: identity-service
      - targets:
          - notification-service-app:4003
        labels:
          service: notification-service

  - job_name: monadiam-postgresql
    static_configs:
      - targets:
          - template-postgresql-exporter:9187
        labels:
          service: template-service
      - targets:
          - organization-postgresql-exporter:9187
        labels:
          service: organization-service
      - targets:
          - hr-postgresql-exporter:9187
        labels:
          service: hr-service
      - targets:
          - access-control-postgresql-exporter:9187
        labels:
          service: access-control-service
      - targets:
          - identity-postgresql-exporter:9187
        labels:
          service: identity-service
      - targets:
          - notification-postgresql-exporter:9187
        labels:
          service: notification-service

  - job_name: monadiam-redis
    static_configs:
      - targets:
          - template-redis-exporter:9121
        labels:
          service: template-service
      - targets:
          - organization-redis-exporter:9121
        labels:
          service: organization-service
      - targets:
          - hr-redis-exporter:9121
        labels:
          service: hr-service
      - targets:
          - access-control-redis-exporter:9121
        labels:
          service: access-control-service
      - targets:
          - identity-redis-exporter:9121
        labels:
          service: identity-service
      - targets:
          - notification-redis-exporter:9121
        labels:
          service: notification-service

  - job_name: monadiam-kafka
    static_configs:
      - targets:
          - kafka-exporter:9308
        labels:
          cluster: local

  - job_name: monadiam-clickhouse
    static_configs:
      - targets:
          - clickhouse:9363
        labels:
          database: audit
    metric_relabel_configs:
      - source_labels:
          - __name__
        regex: ClickHouseErrorMetric_(.*)
        target_label: clickhouse_error
        replacement: $1

  - job_name: monadiam-seaweedfs
    file_sd_configs:
      - files:
          - /etc/prometheus/seaweedfs-targets.yml
