x-base: &base
  restart: on-failure

services:
  grafana:
    <<: *base
    image: ${GRAFANA_IMAGE:?}
    container_name: grafana
    depends_on:
      vault-agent:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:?}:${GRAFANA_INTERNAL_PORT:?}"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/admin_password
      - GF_AUTH_ANONYMOUS_ORG_NAME=${GF_AUTH_ANONYMOUS_ORG_NAME:?}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?}
      - GF_SERVER_HTTP_PORT=${GRAFANA_INTERNAL_PORT:?}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_secrets:/run/secrets:ro
      - grafana_data:/var/lib/grafana
    networks:
      monitoring_net:
      kafka_net:

  prometheus:
    <<: *base
    image: ${PROMETHEUS_IMAGE:?}
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:?}:${PROMETHEUS_INTERNAL_PORT:?}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.listen-address=:${PROMETHEUS_INTERNAL_PORT:?}"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      monitoring_net:

  loki:
    <<: *base
    image: ${LOKI_IMAGE:?}
    container_name: loki
    ports:
      - "${LOKI_PORT:?}:${LOKI_INTERNAL_PORT:?}"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
      - "-server.http-listen-port=${LOKI_INTERNAL_PORT:?}"
    volumes:
      - loki_data:/loki
    networks:
      monitoring_net:

  otel-collector:
    <<: *base
    image: ${OTEL_COLLECTOR_IMAGE:?}
    container_name: otel-collector
    command: ["--config=/etc/otel-collector/config.yaml"]
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:?}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:?}:4318"
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    networks:
      monitoring_net:
        aliases:
          - otel-collector

  tempo:
    <<: *base
    image: ${TEMPO_IMAGE:?}
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yml", "-config.expand-env=true"]
    ports:
      - "${TEMPO_HTTP_PORT:?}:${TEMPO_INTERNAL_PORT:?}"
    environment:
      TEMPO_BLOCK_RETENTION: ${TEMPO_BLOCK_RETENTION:?}
      TEMPO_INTERNAL_PORT: ${TEMPO_INTERNAL_PORT:?}
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      monitoring_net:
        aliases:
          - tempo

volumes:
  prometheus_data:
  grafana_secrets:
  grafana_data:
  tempo_data:
  loki_data:

networks:
  monitoring_net:
    external: true
    name: ${DOCKER_NETWORK_MONITORING:?}
  kafka_net:
    external: true
    name: ${DOCKER_NETWORK_KAFKA:?}
