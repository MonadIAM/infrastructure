x-base: &base
  restart: on-failure
  env_file:
    - ../.env

services:
  prometheus:
    <<: *base
    image: ${PROMETHEUS_IMAGE}
    container_name: prometheus
    command:
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      monitoring_net:
        aliases:
          - prometheus
    mem_limit: 512m

  loki:
    <<: *base
    image: ${LOKI_IMAGE}
    container_name: loki
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      monitoring_net:
        aliases:
          - loki
    mem_limit: 512m

  tempo:
    <<: *base
    image: ${TEMPO_IMAGE}
    container_name: tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "127.0.0.1:${TEMPO_PORT}:3200"
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks:
      monitoring_net:
        aliases:
          - tempo
    mem_limit: 512m

  otel-collector:
    <<: *base
    image: ${OTEL_COLLECTOR_IMAGE}
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      tempo:
        condition: service_started
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT}:4318"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      monitoring_net:
        aliases:
          - otel-collector
    mem_limit: 256m

  grafana:
    <<: *base
    image: ${GRAFANA_IMAGE}
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "light"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/monadiam-local-overview.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      monitoring_net:
        aliases:
          - grafana
    mem_limit: 384m

volumes:
  grafana_data:
  loki_data:
  prometheus_data:
  tempo_data:

networks:
  monitoring_net:
    name: ${DOCKER_NETWORK_MONITORING}
