apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: application-secret-reader
  namespace: monadiam-data
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - access-control-postgresql-ca
      - identity-postgresql-ca
      - notification-postgresql-ca
      - organization-postgresql-ca
      - hr-postgresql-ca
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: application-secret-reader
  namespace: monadiam-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: application-secret-reader
subjects:
  - kind: ServiceAccount
    name: application-secret-reader
    namespace: monadiam-apps
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kubernetes-data
  namespace: monadiam-apps
spec:
  provider:
    kubernetes:
      remoteNamespace: monadiam-data
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: application-secret-reader
