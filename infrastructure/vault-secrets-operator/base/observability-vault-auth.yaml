apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: monadiam-observability
  namespace: monadiam-observability
  labels:
    app.kubernetes.io/name: monadiam-observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator/vault
  kubernetes:
    role: monadiam-observability
    serviceAccount: vault-auth
    audiences:
      - vault
    tokenExpirationSeconds: 600
