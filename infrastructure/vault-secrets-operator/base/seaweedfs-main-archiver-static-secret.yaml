apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: seaweedfs-main-archiver
  namespace: monadiam-data
spec:
  vaultAuthRef: monadiam-data
  mount: kv
  type: kv-v2
  path: monadiam-data/seaweedfs/main/auth
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: seaweedfs-main-archiver
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        SEAWEEDFS_ARCHIVER_ACCESS_KEY:
          text: '{{ get .Secrets "SEAWEEDFS_ARCHIVER_ACCESS_KEY" }}'
        SEAWEEDFS_ARCHIVER_SECRET_KEY:
          text: '{{ get .Secrets "SEAWEEDFS_ARCHIVER_SECRET_KEY" }}'
