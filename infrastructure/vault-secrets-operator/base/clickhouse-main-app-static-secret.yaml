apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: clickhouse-main-app
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: clickhouse-main-app
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  vaultAuthRef: monadiam-data
  mount: kv
  type: kv-v2
  path: monadiam-data/clickhouse/main/app
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: clickhouse-main-app
    type: Opaque
    labels:
      app.kubernetes.io/name: clickhouse-main-app
      app.kubernetes.io/component: analytics
      app.kubernetes.io/part-of: monadiam
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludeRaw: true
