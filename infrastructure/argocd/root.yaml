apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monadiam-root
  namespace: argocd
spec:
  project: monadiam-bootstrap
  source:
    repoURL: https://github.com/MonadIAM/infrastructure.git
    targetRevision: dev
    path: clusters/dev/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
