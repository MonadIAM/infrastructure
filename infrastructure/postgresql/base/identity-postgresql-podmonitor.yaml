apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: identity-postgresql
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: identity-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: identity-postgresql
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
