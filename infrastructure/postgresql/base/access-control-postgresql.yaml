apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: access-control-postgresql
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: access-control-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: access-control-service
      owner: access_control
      secret:
        name: access-control-postgresql-app
      dataChecksums: true
  postgresql:
    parameters:
      wal_level: logical
      max_connections: "256"
      superuser_reserved_connections: "3"
    pg_hba:
      - hostnossl all all all reject
  managed:
    roles:
      - name: access_control
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: access-control-postgresql-app
      - name: debezium
        ensure: present
        login: true
        replication: true
        inRoles:
          - access_control
        passwordSecret:
          name: access-control-postgresql-debezium
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: access-control-postgresql
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: monadiam
