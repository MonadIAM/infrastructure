apicurio.storage.kind=kafkasql
apicurio.kafkasql.bootstrap.servers=kafka-main-kafka-bootstrap.monadiam-messaging.svc:9093
apicurio.kafkasql.topic=kafkasql-journal
apicurio.kafkasql.snapshots.topic=kafkasql-snapshots
apicurio.events.kafka.topic=registry-events
apicurio.kafkasql.topic.auto-create=false
apicurio.kafkasql.consumer.group-prefix=schema-registry-main-
apicurio.storage.snapshot.location=/tmp

apicurio.kafka.common.security.protocol=SASL_SSL
apicurio.kafka.common.sasl.mechanism=SCRAM-SHA-512
apicurio.kafka.common.sasl.jaas.config=${KAFKA_JAAS_CONFIG}
apicurio.kafka.common.ssl.truststore.type=PEM
apicurio.kafka.common.ssl.truststore.location=/etc/kafka-ca/ca.crt
apicurio.kafka.common.ssl.endpoint.identification.algorithm=https

apicurio.rules.global.validity=FULL
apicurio.rules.global.compatibility=BACKWARD
apicurio.rules.global.integrity=FULL
