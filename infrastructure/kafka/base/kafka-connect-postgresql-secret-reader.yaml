apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-connect-postgresql-secret-reader
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: kafka-connect-postgresql-secret-reader
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - access-control-postgresql-debezium
      - identity-postgresql-debezium
      - notification-postgresql-debezium
      - organization-postgresql-debezium
      - hr-postgresql-debezium
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-connect-postgresql-secret-reader
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: kafka-connect-postgresql-secret-reader
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
subjects:
  - kind: ServiceAccount
    name: kafka-connect-connect
    namespace: monadiam-messaging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-connect-postgresql-secret-reader
