fullnameOverride: otel-collector

mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

alternateConfig:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 256
      spike_limit_mib: 64
    batch: {}
  exporters:
    debug:
      verbosity: detailed
    otlp/tempo:
      endpoint: tempo:4317
      tls:
        insecure: true
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
  service:
    telemetry:
      resource:
        attributes:
          - name: k8s.namespace.name
            value: ${env:OTEL_K8S_NAMESPACE}
          - name: k8s.node.name
            value: ${env:OTEL_K8S_NODE_NAME}
          - name: k8s.node.ip
            value: ${env:OTEL_K8S_NODE_IP}
          - name: k8s.pod.name
            value: ${env:OTEL_K8S_POD_NAME}
          - name: k8s.pod.ip
            value: ${env:OTEL_K8S_POD_IP}
          - name: host.name
            value: ${env:OTEL_K8S_NODE_NAME}
      logs:
        level: info
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
    extensions:
      - health_check
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug, otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]

serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
      interval: 30s
