fullnameOverride: loki

commonLabels:
  app.kubernetes.io/component: observability
  app.kubernetes.io/part-of: monadiam

deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    max_query_lookback: 24h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    retention_period: 24h
    split_queries_by_interval: 15m
    volume_enabled: true
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

lokiCanary:
  enabled: false

gateway:
  enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
  persistence:
    enabled: true
    storageClass: local-path-retain
    accessModes:
      - ReadWriteOnce
    size: 2Gi

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false

minio:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s

test:
  enabled: false
