apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgresql-main-app
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: postgresql-main-app
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  vaultAuthRef: monadiam-data
  mount: kv
  type: kv-v2
  path: monadiam-data/postgresql/main/app
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: postgresql-main-app
    type: kubernetes.io/basic-auth
    labels:
      app.kubernetes.io/name: postgresql-main-app
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: monadiam
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludeRaw: true
