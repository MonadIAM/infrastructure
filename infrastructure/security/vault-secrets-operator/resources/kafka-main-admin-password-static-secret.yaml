apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kafka-main-admin-password
  namespace: monadiam-messaging
  labels:
    app.kubernetes.io/name: kafka-main-admin-password
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  vaultAuthRef: monadiam-messaging
  mount: kv
  type: kv-v2
  path: monadiam-messaging/kafka/main/admin
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: kafka-main-admin-password
    type: Opaque
    labels:
      app.kubernetes.io/name: kafka-main-admin-password
      app.kubernetes.io/component: messaging
      app.kubernetes.io/part-of: monadiam
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludeRaw: true
