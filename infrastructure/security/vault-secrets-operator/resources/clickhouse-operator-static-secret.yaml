apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: clickhouse-operator-credentials
  namespace: clickhouse-operator
  labels:
    app.kubernetes.io/name: clickhouse-operator-credentials
    app.kubernetes.io/component: analytics-operator
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  vaultAuthRef: clickhouse-operator
  mount: kv
  type: kv-v2
  path: clickhouse-operator/operator-credentials
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: clickhouse-operator-altinity-clickhouse-operator
    type: Opaque
    labels:
      app.kubernetes.io/name: clickhouse-operator-altinity-clickhouse-operator
      app.kubernetes.io/component: analytics-operator
      app.kubernetes.io/part-of: monadiam
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludeRaw: true
