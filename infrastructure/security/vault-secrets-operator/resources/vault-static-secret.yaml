apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: monadiam-bootstrap
  namespace: monadiam-apps
  labels:
    app.kubernetes.io/name: monadiam-bootstrap
    app.kubernetes.io/component: apps
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  vaultAuthRef: monadiam-apps
  mount: kv
  type: kv-v2
  path: monadiam-apps/bootstrap
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: monadiam-bootstrap
    type: Opaque
    labels:
      app.kubernetes.io/name: monadiam-bootstrap
      app.kubernetes.io/component: apps
      app.kubernetes.io/part-of: monadiam
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludeRaw: true
