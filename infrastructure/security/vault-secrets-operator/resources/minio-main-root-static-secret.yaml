apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: minio-main-root
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: minio-main-root
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  vaultAuthRef: monadiam-data
  mount: kv
  type: kv-v2
  path: monadiam-data/minio/main/root
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: minio-main-root
    type: Opaque
    labels:
      app.kubernetes.io/name: minio-main-root
      app.kubernetes.io/component: object-storage
      app.kubernetes.io/part-of: monadiam
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        config.env:
          text: |
            {{- printf "export MINIO_ROOT_USER=\"%s\"\nexport MINIO_ROOT_PASSWORD=\"%s\"\n" (get .Secrets "MINIO_ROOT_USER") (get .Secrets "MINIO_ROOT_PASSWORD") -}}
