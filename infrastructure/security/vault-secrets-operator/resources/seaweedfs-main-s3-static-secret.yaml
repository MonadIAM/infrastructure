apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: seaweedfs-main-s3
  namespace: monadiam-data
spec:
  vaultAuthRef: monadiam-data
  mount: kv
  type: kv-v2
  path: monadiam-data/seaweedfs/main/auth
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: seaweedfs-main-s3
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        seaweedfs_s3_config:
          text: '{{ get .Secrets "seaweedfs_s3_config" }}'
