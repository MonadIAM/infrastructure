apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: access-control-redis-auth
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: access-control-redis-auth
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  vaultAuthRef: monadiam-data
  mount: kv
  type: kv-v2
  path: monadiam-data/redis/access-control/auth
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: access-control-redis-auth
    type: Opaque
    labels:
      app.kubernetes.io/name: access-control-redis-auth
      app.kubernetes.io/component: cache
      app.kubernetes.io/part-of: monadiam
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludeRaw: true
