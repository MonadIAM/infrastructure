apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-admin
  namespace: monadiam-observability
  labels:
    app.kubernetes.io/name: grafana-admin
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  vaultAuthRef: monadiam-observability
  mount: kv
  type: kv-v2
  path: monadiam-observability/grafana/admin
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: grafana-admin
    type: Opaque
    labels:
      app.kubernetes.io/name: grafana-admin
      app.kubernetes.io/component: observability
      app.kubernetes.io/part-of: monadiam
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludeRaw: true
