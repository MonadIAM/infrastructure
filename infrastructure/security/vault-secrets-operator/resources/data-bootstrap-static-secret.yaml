apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: monadiam-data-bootstrap
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: monadiam-data-bootstrap
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  vaultAuthRef: monadiam-data
  mount: kv
  type: kv-v2
  path: monadiam-data/bootstrap
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: monadiam-data-bootstrap
    type: Opaque
    labels:
      app.kubernetes.io/name: monadiam-data-bootstrap
      app.kubernetes.io/component: data
      app.kubernetes.io/part-of: monadiam
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludeRaw: true
