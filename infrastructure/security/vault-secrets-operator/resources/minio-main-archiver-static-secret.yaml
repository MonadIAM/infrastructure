apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: minio-main-archiver
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: minio-main-archiver
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  vaultAuthRef: monadiam-data
  mount: kv
  type: kv-v2
  path: monadiam-data/minio/main/archiver
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: minio-main-archiver
    type: Opaque
    labels:
      app.kubernetes.io/name: minio-main-archiver
      app.kubernetes.io/component: object-storage
      app.kubernetes.io/part-of: monadiam
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludeRaw: true
