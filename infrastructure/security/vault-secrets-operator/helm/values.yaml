    globalTransformationOptions:
      excludeRaw: true
    clientCache:
      persistenceModel: none
  podSecurityContext:
    runAsNonRoot: true

  securityContext:
    allowPrivilegeEscalation: false

defaultVaultConnection:
  enabled: false

defaultAuthMethod:
  enabled: false

telemetry:
  serviceMonitor:
    enabled: false

csi:
  enabled: false

tests:
  enabled: false
