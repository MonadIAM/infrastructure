apiVersion: batch/v1
kind: Job
metadata:
  name: shared-schemas
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: shared-schemas
    app.kubernetes.io/component: schema-publisher
    app.kubernetes.io/part-of: monadiam
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shared-schemas
    spec:
      restartPolicy: Never
      serviceAccountName: shared-schemas
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publisher
          image: ghcr.io/monadiam/shared-schemas
          imagePullPolicy: IfNotPresent
          args: [scripts/apply.sh]
          envFrom:
            - configMapRef:
                name: shared-schemas
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
