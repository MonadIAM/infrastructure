vault:
  mount: kv
  engine: kv-v2
delivery:
  controller: vault-secrets-operator
  refreshAfter: 60s
auth:
  - namespace: monadiam-apps
    serviceAccount: vault-auth
    vaultAuth: monadiam-apps
    vaultRole: monadiam-apps
    policy: monadiam-apps-read
  - namespace: monadiam-data
    serviceAccount: vault-auth
    vaultAuth: monadiam-data
    vaultRole: monadiam-data
    policy: monadiam-data-read
  - namespace: monadiam-messaging
    serviceAccount: vault-auth
    vaultAuth: monadiam-messaging
    vaultRole: monadiam-messaging
    policy: monadiam-messaging-read
  - namespace: monadiam-observability
    serviceAccount: vault-auth
    vaultAuth: monadiam-observability
    vaultRole: monadiam-observability
    policy: monadiam-observability-read
  - namespace: clickhouse-operator
    serviceAccount: vault-auth
    vaultAuth: clickhouse-operator
    vaultRole: clickhouse-operator
    policy: clickhouse-operator-read
secrets:
  - id: seaweedfs-main-s3
    vaultPath: monadiam-data/seaweedfs/main/auth
    namespace: monadiam-data
    kubernetesSecret: seaweedfs-main-s3
    type: Opaque
    keys:
      - seaweedfs_s3_config
    consumer: seaweedfs
    status: synced
  - id: seaweedfs-main-admin
    vaultPath: monadiam-data/seaweedfs/main/auth
    namespace: monadiam-data
    kubernetesSecret: seaweedfs-main-admin
    type: Opaque
    keys:
      - SEAWEEDFS_ADMIN_ACCESS_KEY
      - SEAWEEDFS_ADMIN_SECRET_KEY
    consumer: seaweedfs-main-bootstrap
    status: synced
  - id: seaweedfs-main-archiver
    vaultPath: monadiam-data/seaweedfs/main/auth
    namespace: monadiam-data
    kubernetesSecret: seaweedfs-main-archiver
    type: Opaque
    keys:
      - SEAWEEDFS_ARCHIVER_ACCESS_KEY
      - SEAWEEDFS_ARCHIVER_SECRET_KEY
    consumer: archiver
    status: synced
  - id: grafana-admin
    vaultPath: monadiam-observability/grafana/admin
    namespace: monadiam-observability
    kubernetesSecret: grafana-admin
    type: Opaque
    keys:
      - admin-user
      - admin-password
    consumer: grafana
    status: synced
  - id: postgresql-main-superuser
    vaultPath: monadiam-data/postgresql/main/superuser
    namespace: monadiam-data
    kubernetesSecret: postgresql-main-superuser
    type: kubernetes.io/basic-auth
    keys:
      - username
      - password
    consumer: cloudnative-pg
    status: synced
  - id: postgresql-main-app
    vaultPath: monadiam-data/postgresql/main/app
    namespace: monadiam-data
    kubernetesSecret: postgresql-main-app
    type: kubernetes.io/basic-auth
    keys:
      - username
      - password
    consumer: cloudnative-pg
    status: synced
  - id: postgresql-main-debezium
    vaultPath: monadiam-data/postgresql/main/debezium
    namespace: monadiam-data
    kubernetesSecret: postgresql-main-debezium
    type: kubernetes.io/basic-auth
    keys:
      - username
      - password
    consumer: cloudnative-pg,debezium
    status: synced
  - id: redis-main-auth
    vaultPath: monadiam-data/redis/main/auth
    namespace: monadiam-data
    kubernetesSecret: redis-main-auth
    type: Opaque
    keys:
      - redis-password
    consumer: redis
    status: synced
  - id: clickhouse-operator-credentials
    vaultPath: clickhouse-operator/operator-credentials
    namespace: clickhouse-operator
    kubernetesSecret: clickhouse-operator-altinity-clickhouse-operator
    type: Opaque
    keys:
      - username
      - password
    consumer: altinity-clickhouse-operator
    status: synced
  - id: clickhouse-main-app
    vaultPath: monadiam-data/clickhouse/main/app
    namespace: monadiam-data
    kubernetesSecret: clickhouse-main-app
    type: Opaque
    keys:
      - username
      - password_sha256_hex
    consumer: clickhouse
    status: synced
  - id: clickhouse-main-intercluster
    vaultPath: monadiam-data/clickhouse/main/intercluster
    namespace: monadiam-data
    kubernetesSecret: clickhouse-main-intercluster
    type: Opaque
    keys:
      - secret
    consumer: clickhouse
    status: synced
  - id: kafka-main-admin-password
    vaultPath: monadiam-messaging/kafka/main/admin
    namespace: monadiam-messaging
    kubernetesSecret: kafka-main-admin-password
    type: Opaque
    keys:
      - username
      - password
    consumer: strimzi
    status: synced
  - id: kafka-connect-rest-api-tls
    vaultPath: monadiam-messaging/kafka-connect/rest-api/tls
    namespace: monadiam-messaging
    kubernetesSecret: kafka-connect-rest-api-tls
    type: kubernetes.io/tls
    keys:
      - ca.crt
      - tls.crt
      - tls.key
    consumer: kafka-connect
    status: reserved
