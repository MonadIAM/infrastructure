apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka-main
  namespace: monadiam-messaging
  labels:
    app.kubernetes.io/name: kafka-main
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
      superUsers:
        - kafka-main-admin
    config:
      auto.create.topics.enable: false
