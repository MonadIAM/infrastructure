apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-main-admin
  namespace: monadiam-messaging
  labels:
    strimzi.io/cluster: kafka-main
    app.kubernetes.io/name: kafka-main-admin
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: kafka-main-admin-password
          key: password
  authorization:
    type: simple
    acls:
      - resource:
          type: cluster
        operations:
          - All
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: transactionalId
          name: "*"
          patternType: literal
        operations:
          - All
