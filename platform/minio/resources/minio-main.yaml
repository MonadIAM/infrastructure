apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio-main
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: minio-main
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
  imagePullPolicy: IfNotPresent
  configuration:
    name: minio-main-root
  requestAutoCert: false
  externalCertSecret:
    - name: minio-main-tls
      type: kubernetes.io/tls
  externalCaCertSecret:
    - name: minio-main-tls
      type: kubernetes.io/tls
  mountPath: /export
  subPath: /data
  podManagementPolicy: Parallel
  features:
    bucketDNS: false
    enableSFTP: false
  pools:
    - name: pool-0
      servers: 2
      volumesPerServer: 4
      resources:
        requests:
          cpu: 250m
          memory: 768Mi
        limits:
          memory: 1536Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumeClaimTemplate:
        metadata:
          name: data
          labels:
            app.kubernetes.io/name: minio-main
            app.kubernetes.io/component: object-storage
            app.kubernetes.io/part-of: monadiam
            app.kubernetes.io/managed-by: kustomize
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path-retain
          resources:
            requests:
              storage: 2Gi
  buckets:
    - name: audit-archive
      objectLock: true
    - name: change-log-archive
      objectLock: true
    - name: files-default
      objectLock: false
