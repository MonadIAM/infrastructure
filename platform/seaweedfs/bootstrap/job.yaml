apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-main-bootstrap
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-main-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "${SEAWEEDFS_BOOTSTRAP_IMAGE}"
          imagePullPolicy: Never
          args:
            - seaweedfs
            - reconcile
            - --env-file=
          envFrom:
            - configMapRef:
                name: seaweedfs-main-bootstrap
            - secretRef:
                name: seaweedfs-main-admin
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: seaweedfs-main-buckets
