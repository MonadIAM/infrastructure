apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-main-bootstrap
data:
  SEAWEEDFS_ENDPOINT: "${SEAWEEDFS_ENDPOINT}"
  SEAWEEDFS_REGION: "${SEAWEEDFS_REGION}"
  SEAWEEDFS_AUDIT_LOG_BUCKET: "${SEAWEEDFS_AUDIT_LOG_BUCKET}"
  SEAWEEDFS_AUDIT_LOG_RETENTION_DAYS: "${SEAWEEDFS_AUDIT_LOG_RETENTION_DAYS}"
  SEAWEEDFS_CHANGE_LOG_BUCKET: "${SEAWEEDFS_CHANGE_LOG_BUCKET}"
  SEAWEEDFS_CHANGE_LOG_RETENTION_DAYS: "${SEAWEEDFS_CHANGE_LOG_RETENTION_DAYS}"
  SEAWEEDFS_CONFIG_DIR: /config
  INFRA_TIMEOUT: 2m
