apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: organization-redis-tls
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: organization-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  secretName: organization-redis-tls
  commonName: organization-redis.monadiam-data.svc.cluster.local
  dnsNames:
    - organization-redis
    - organization-redis.monadiam-data
    - organization-redis.monadiam-data.svc
    - organization-redis.monadiam-data.svc.cluster.local
    - organization-redis-headless
    - organization-redis-headless.monadiam-data
    - organization-redis-headless.monadiam-data.svc
    - organization-redis-headless.monadiam-data.svc.cluster.local
    - "*.organization-redis-headless.monadiam-data.svc.cluster.local"
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: monadiam-ca
