apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis-main-tls
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: redis-main
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  secretName: redis-main-tls
  commonName: redis-main.monadiam-data.svc.cluster.local
  dnsNames:
    - redis-main
    - redis-main.monadiam-data
    - redis-main.monadiam-data.svc
    - redis-main.monadiam-data.svc.cluster.local
    - redis-main-headless
    - redis-main-headless.monadiam-data
    - redis-main-headless.monadiam-data.svc
    - redis-main-headless.monadiam-data.svc.cluster.local
    - "*.redis-main-headless.monadiam-data.svc.cluster.local"
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: monadiam-ca
