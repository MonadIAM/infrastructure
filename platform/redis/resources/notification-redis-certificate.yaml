apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: notification-redis-tls
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: notification-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  secretName: notification-redis-tls
  commonName: notification-redis.monadiam-data.svc.cluster.local
  dnsNames:
    - notification-redis
    - notification-redis.monadiam-data
    - notification-redis.monadiam-data.svc
    - notification-redis.monadiam-data.svc.cluster.local
    - notification-redis-headless
    - notification-redis-headless.monadiam-data
    - notification-redis-headless.monadiam-data.svc
    - notification-redis-headless.monadiam-data.svc.cluster.local
    - "*.notification-redis-headless.monadiam-data.svc.cluster.local"
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: monadiam-ca
