apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: identity-redis-tls
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: identity-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  secretName: identity-redis-tls
  commonName: identity-redis.monadiam-data.svc.cluster.local
  dnsNames:
    - identity-redis
    - identity-redis.monadiam-data
    - identity-redis.monadiam-data.svc
    - identity-redis.monadiam-data.svc.cluster.local
    - identity-redis-headless
    - identity-redis-headless.monadiam-data
    - identity-redis-headless.monadiam-data.svc
    - identity-redis-headless.monadiam-data.svc.cluster.local
    - "*.identity-redis-headless.monadiam-data.svc.cluster.local"
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: monadiam-ca
