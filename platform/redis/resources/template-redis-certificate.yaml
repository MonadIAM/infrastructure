apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: template-redis-tls
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: template-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  secretName: template-redis-tls
  commonName: template-redis.monadiam-data.svc.cluster.local
  dnsNames:
    - template-redis
    - template-redis.monadiam-data
    - template-redis.monadiam-data.svc
    - template-redis.monadiam-data.svc.cluster.local
    - template-redis-headless
    - template-redis-headless.monadiam-data
    - template-redis-headless.monadiam-data.svc
    - template-redis-headless.monadiam-data.svc.cluster.local
    - "*.template-redis-headless.monadiam-data.svc.cluster.local"
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: monadiam-ca
