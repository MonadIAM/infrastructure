apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../platform/apicurio/schemas
images:
  - name: ghcr.io/monadiam/shared-schemas
    newTag: 3.4.0
replacements:
  - source:
      kind: Job
      name: shared-schemas
      fieldPath: spec.template.spec.containers.[name=publisher].image
    targets:
      - select:
          kind: ConfigMap
          name: shared-schemas
        fieldPaths:
          - data.SCHEMA_PUBLICATION_IMAGE
