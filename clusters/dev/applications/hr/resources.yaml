apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-service
  namespace: monadiam-apps
spec:
  replicas: 3
  template:
    spec:
      initContainers:
        - name: vault-agent
          resources:
            limits:
              cpu: 100m
      containers:
        - name: service
          resources:
            limits:
              cpu: "1"
              memory: 1536Mi
            requests:
              cpu: "1"
              memory: 1536Mi
