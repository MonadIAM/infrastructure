apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  namespace: monadiam-messaging
spec:
  replicas: 1
  template:
    buildContainer:
      securityContext:
        appArmorProfile:
          type: Unconfined
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
  build:
    output:
      type: docker
      image: monadiam-registry:5000/monadiam/kafka-connect:3.6.1-final
      additionalPushOptions:
        - "--tls-verify=false"
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
