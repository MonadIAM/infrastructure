apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monadiam-external-secrets
  namespace: argocd
spec:
  project: monadiam-platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      releaseName: external-secrets
      valuesObject:
        scopedNamespace: monadiam-apps
        scopedRBAC: true
        openshiftFinalizers: false
        processClusterExternalSecret: false
        processClusterPushSecret: false
        processClusterStore: false
        processClusterGenerator: false
        processPushSecret: false
        crds:
          createClusterExternalSecret: false
          createClusterSecretStore: false
          createClusterGenerator: false
          createClusterPushSecret: false
          createPushSecret: false
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
