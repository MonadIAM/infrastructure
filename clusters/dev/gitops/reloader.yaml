apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monadiam-reloader
  namespace: argocd
spec:
  project: monadiam-platform
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.19
    helm:
      releaseName: reloader
      valuesObject:
        reloader:
          watchGlobally: false
          autoReloadAll: false
          reloadStrategy: annotations
          ignoreJobs: true
          ignoreCronJobs: true
          deployment:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monadiam-apps
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
