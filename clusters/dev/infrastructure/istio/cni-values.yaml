profile: ambient
resources:
  requests:
    cpu: 100m
    memory: 100Mi
  limits:
    memory: 256Mi
    cpu: 250m
cni:
  cniBinDir: /var/snap/microk8s/current/opt/cni/bin
  cniConfDir: /var/snap/microk8s/current/args/cni-network
  ambient:
    dnsCapture: false
    ipv6: false
    reconcileIptablesOnStartup: true
