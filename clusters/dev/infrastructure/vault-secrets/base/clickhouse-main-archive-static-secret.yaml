apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: clickhouse-main-archive
  namespace: monadiam-data
spec:
  vaultAuthRef: monadiam-data
  mount: kv
  type: kv-v2
  path: monadiam-data/clickhouse/main/archive
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: clickhouse-main-archive
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        CLICKHOUSE_USER:
          text: '{{ get .Secrets "username" }}'
        CLICKHOUSE_PASSWORD:
          text: '{{ get .Secrets "password" }}'
