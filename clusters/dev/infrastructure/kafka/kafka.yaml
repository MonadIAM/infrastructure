apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka-main
  namespace: monadiam-messaging
spec:
  kafka:
    config:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.min.isr: 1
      transaction.state.log.replication.factor: 1
  entityOperator:
    topicOperator:
      jvmOptions:
        -Xms: 128m
        -Xmx: 256m
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    userOperator:
      jvmOptions:
        -Xms: 128m
        -Xmx: 256m
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
