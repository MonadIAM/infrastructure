fullnameOverride: kube-prometheus-stack
commonLabels:
  app.kubernetes.io/component: observability
  app.kubernetes.io/part-of: monadiam
defaultRules:
  create: true
alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 24h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-retain
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
        cpu: 100m
grafana:
  enabled: false
  forceDeployDashboards: true
  defaultDashboardsEnabled: true
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
  forceDeployDashboards: true
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
      cpu: 250m
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
prometheus:
  enabled: true
  serviceMonitor:
    selfMonitor: true
  prometheusSpec:
    retention: 24h
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-retain
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
        cpu: 500m
    retentionSize: 1500MB
  additionalPodMonitors:
    - name: vault-agents
      namespaceSelector:
        matchNames:
          - monadiam-apps
      selector:
        matchLabels:
          app.kubernetes.io/part-of: monadiam
          app.kubernetes.io/component: application
      podMetricsEndpoints:
        - port: vault-metrics
          path: /agent/v1/metrics
          params:
            format:
              - prometheus
          interval: 5s
          scrapeTimeout: 4s
  additionalServiceMonitors:
    - name: applications
      namespaceSelector:
        matchNames:
          - monadiam-apps
      selector:
        matchLabels:
          app.kubernetes.io/part-of: monadiam
          app.kubernetes.io/component: application
      endpoints:
        - port: http
          path: /api/v1/metrics
          interval: 15s
          scrapeTimeout: 10s
extraManifests:
  - apiVersion: monitoring.coreos.com/v1
    kind: PodMonitor
    metadata:
      name: vault
      namespace: vault
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: vault
          component: server
      podMetricsEndpoints:
        - port: https
          path: /v1/sys/metrics
          scheme: https
          params:
            format:
              - prometheus
          interval: 5s
          scrapeTimeout: 4s
          tlsConfig:
            serverName: vault.vault.svc.cluster.local
            ca:
              secret:
                name: vault-server-tls
                key: ca.crt
