apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-archive-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-archive
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - clickhouse
            - reconcile
            - --env-file=
          envFrom:
            - configMapRef:
                name: clickhouse-archive-config
            - secretRef:
                name: clickhouse-main-archive
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: schema
          configMap:
            name: clickhouse-archive-schema
