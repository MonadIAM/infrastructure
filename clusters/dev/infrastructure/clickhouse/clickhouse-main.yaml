apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse-main
  namespace: monadiam-data
  labels:
    app.kubernetes.io/name: clickhouse-main
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/managed-by: kustomize
spec:
  templates:
    podTemplates:
      - name: clickhouse-main
        spec:
          serviceAccountName: clickhouse-main
          containers:
            - name: clickhouse
              image: altinity/clickhouse-server:25.8.16.10002.altinitystable
              ports:
                - name: metrics
                  containerPort: 9363
                  protocol: TCP
              resources:
                requests:
                  cpu: 250m
                  memory: 768Mi
                limits:
                  cpu: "1"
                  memory: 1536Mi
              volumeMounts:
                - name: clickhouse-storage
                  mountPath: /var/lib/clickhouse
                - name: kafka-ca
                  mountPath: /etc/clickhouse-server/kafka-ca
                  readOnly: true
              env:
                - name: KAFKA_ARCHIVE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kafka-main-archive
                      key: password
          volumes:
            - name: kafka-ca
              secret:
                secretName: kafka-main-cluster-ca-cert
    volumeClaimTemplates:
      - name: clickhouse-storage
        reclaimPolicy: Retain
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-retain
          resources:
            requests:
              storage: 5Gi
  configuration:
    files:
      config.d/archive-kafka.xml: |
        <clickhouse>
            <named_collections>
                <archive_kafka>
                    <kafka>
                        <security_protocol>SASL_SSL</security_protocol>
                        <sasl_mechanism>SCRAM-SHA-512</sasl_mechanism>
                        <sasl_username>kafka-main-archive</sasl_username>
                        <sasl_password from_env="KAFKA_ARCHIVE_PASSWORD"/>
                        <ssl_ca_location>/etc/clickhouse-server/kafka-ca/ca.crt</ssl_ca_location>
                    </kafka>
                </archive_kafka>
            </named_collections>
        </clickhouse>
      config.d/prometheus.xml: |
        <clickhouse>
            <prometheus>
                <port>9363</port>
                <endpoint>/metrics</endpoint>
                <metrics>true</metrics>
                <asynchronous_metrics>true</asynchronous_metrics>
                <events>true</events>
                <errors>true</errors>
                <histograms>true</histograms>
                <dimensional_metrics>true</dimensional_metrics>
            </prometheus>
        </clickhouse>
    users:
      default/networks/ip:
        - "127.0.0.1/32"
      app/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: clickhouse-main-app
            key: password_sha256_hex
      app/networks/ip:
        - "::/0"
      app/profile: default
      app/quota: default
      archive/password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-main-archive
            key: CLICKHOUSE_PASSWORD
      archive/networks/ip:
        - "::/0"
      archive/profile: default
      archive/quota: default
      archive/grants/query:
        - GRANT CREATE DATABASE ON *.*
        - GRANT CREATE TABLE, ALTER TABLE, CREATE VIEW, INSERT, SELECT ON audit.*
        - GRANT SELECT ON system.parts
        - GRANT READ, WRITE ON S3
        - GRANT NAMED COLLECTION ON archive_kafka
        - GRANT TABLE ENGINE ON Kafka
        - GRANT TABLE ENGINE ON MergeTree
        - GRANT READ, WRITE ON KAFKA
    clusters:
      - name: main
        secret:
          valueFrom:
            secretKeyRef:
              name: clickhouse-main-intercluster
              key: secret
        layout:
          shardsCount: 1
          replicasCount: 1
        templates:
          podTemplate: clickhouse-main
