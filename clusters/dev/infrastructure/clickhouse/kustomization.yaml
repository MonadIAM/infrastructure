apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../infrastructure/clickhouse/base
patches:
  - target:
      kind: ClickHouseInstallation
      name: clickhouse-main
    patch: |-
      - op: add
        path: /spec/templates/podTemplates/0/spec/containers/0/resources/limits/cpu
        value: "1"
