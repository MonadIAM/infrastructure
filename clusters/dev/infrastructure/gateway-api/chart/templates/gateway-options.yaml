apiVersion: v1
kind: ConfigMap
metadata:
  name: public-gateway-options
  namespace: istio-ingress
data:
  service: |
    spec:
      type: ClusterIP
  deployment: |
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          securityContext:
            sysctls: []
          containers:
            - name: istio-proxy
              securityContext:
                runAsUser: 0
                runAsNonRoot: false
                capabilities:
                  add: [NET_BIND_SERVICE]
