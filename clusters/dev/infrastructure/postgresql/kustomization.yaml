apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../infrastructure/postgresql/base

patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: postgresql
      spec:
        instances: 1
        smartShutdownTimeout: 0
        storage:
          storageClass: local-retain
        walStorage:
          storageClass: local-wal-retain
  - path: access-control.yaml
  - path: identity.yaml
  - path: notification.yaml
  - path: organization.yaml
  - path: hr.yaml
