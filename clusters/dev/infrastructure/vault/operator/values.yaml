controller:
  manager:
    globalTransformationOptions:
      excludeRaw: true
    clientCache:
      persistenceModel: none
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
  replicas: 1
  kubeRbacProxy:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
defaultVaultConnection:
  enabled: false
defaultAuthMethod:
  enabled: false
telemetry:
  serviceMonitor:
    enabled: false
csi:
  enabled: false
tests:
  enabled: false
hooks:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
