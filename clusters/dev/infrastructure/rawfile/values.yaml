controller:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
  externalResizer:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
node:
  storagePools:
    wal:
      # Host filesystem, outside both k3s.ext4 and k3s-volumes.ext4.
      path: /var/lib/monadiam/postgresql-wal
      reservedCapacity: "5%"
      reservedCapacityMode: plain
  driverRegistrar:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  externalProvisioner:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Helm replaces lists: preserve the existing data class as well as adding WAL.
storageClasses:
  - name: local-retain
    enabled: true
    isDefault: false
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    reclaimPolicy: Retain
    fsType: ext4
    thinProvision: "false"
    copyOnWrite: "false"
  - name: local-wal-retain
    enabled: true
    isDefault: false
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    reclaimPolicy: Retain
    fsType: ext4
    thinProvision: "false"
    copyOnWrite: "false"
    storagePool: wal
