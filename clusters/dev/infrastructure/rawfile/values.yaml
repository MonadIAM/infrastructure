analytics:
  enabled: false
capabilities:
  snapshots:
    enabled: false
  apiServer:
    enabled: false
crds:
  csi:
    volumeSnapshots:
      enabled: false
snapshotClasses: []
node:
  kubeletPath: /var/snap/microk8s/common/var/lib/kubelet
  metadataDirPath: /var/lib/monadiam/microk8s/volume-metadata
  storagePools:
    default:
      path: /var/lib/monadiam/microk8s/volumes
      reservedCapacity: "5%"
      reservedCapacityMode: plain
    wal:
      path: /var/lib/monadiam/postgresql-wal
      reservedCapacity: "5%"
      reservedCapacityMode: plain
  driverRegistrar:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  externalProvisioner:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
storageClasses:
  - name: local-retain
    enabled: true
    isDefault: false
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    reclaimPolicy: Retain
    fsType: ext4
    thinProvision: "false"
    copyOnWrite: "false"
  - name: local-wal-retain
    enabled: true
    isDefault: false
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    reclaimPolicy: Retain
    fsType: ext4
    thinProvision: "false"
    copyOnWrite: "false"
    storagePool: wal
controller:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
  externalResizer:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
