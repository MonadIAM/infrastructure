apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monadiam-reloader
  namespace: argocd
spec:
  project: monadiam-platform
  sources:
    - repoURL: https://stakater.github.io/stakater-charts
      chart: reloader
      targetRevision: 2.2.19
      helm:
        releaseName: reloader
        valueFiles:
          - $values/clusters/dev/infrastructure/reloader/values.yaml
    - repoURL: https://github.com/MonadIAM/infrastructure.git
      targetRevision: dev
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monadiam-apps
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
