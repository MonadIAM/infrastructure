apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monadiam-application-secrets
  namespace: argocd
spec:
  project: monadiam-platform
  source:
    repoURL: https://github.com/MonadIAM/infrastructure.git
    targetRevision: dev
    path: infrastructure/application-secrets/base
  destination:
    server: https://kubernetes.default.svc
    namespace: monadiam-apps
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
