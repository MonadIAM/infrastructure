apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monadiam-grafana
  namespace: argocd
spec:
  project: monadiam-observability
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 12.7.3
      helm:
        releaseName: grafana
        valueFiles:
          - $values/clusters/dev/infrastructure/grafana/values.yaml
    - repoURL: https://github.com/MonadIAM/infrastructure.git
      targetRevision: dev
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monadiam-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
