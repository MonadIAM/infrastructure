apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monadiam-external-secrets
  namespace: argocd
spec:
  project: monadiam-platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/clusters/dev/infrastructure/external-secrets/values.yaml
    - repoURL: https://github.com/MonadIAM/infrastructure.git
      targetRevision: dev
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
