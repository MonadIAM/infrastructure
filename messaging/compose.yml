x-base: &base
  restart: on-failure

services:
  kafka:
    <<: *base
    image: ${KAFKA_IMAGE:?}
    container_name: kafka
    group_add:
      - "10000"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
      KAFKA_INTERNAL_PORT: ${KAFKA_INTERNAL_PORT:?}
      KAFKA_CONTROLLER_PORT: ${KAFKA_CONTROLLER_PORT:?}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:?}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:?}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:?}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      service-tls:
        condition: service_completed_successfully
      vault-agent:
        condition: service_healthy
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./start-secure-kafka.sh:/start-secure-kafka.sh:ro
      - service_tls:/tls:ro
      - kafka_secrets:/vault/secrets/kafka:ro
    entrypoint: ["bash", "/start-secure-kafka.sh"]
    networks:
      kafka_net:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:${KAFKA_INTERNAL_PORT} --command-config /home/appuser/kafka/health.properties >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-init:
    image: ${KAFKA_IMAGE:?}
    container_name: kafka-init
    group_add:
      - "10000"
    env_file:
      - ../.env
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./init-topics.sh:/init-topics.sh:ro
      - service_tls:/tls:ro
      - kafka_secrets:/vault/secrets/kafka:ro
    entrypoint: ["bash", "/init-topics.sh"]
    networks:
      kafka_net:

  kafka-ui:
    <<: *base
    image: ${KAFKA_UI_IMAGE:?}
    container_name: kafka-ui
    group_add:
      - "10000"
    ports:
      - "${KAFKA_UI_PORT}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/vault/secrets/kafka/kafka-ui.yml
    volumes:
      - service_tls:/tls:ro
      - kafka_secrets:/vault/secrets/kafka:ro
    networks:
      kafka_net:

  kafka-connect:
    <<: *base
    image: ${KAFKA_CONNECT_IMAGE:?}
    container_name: kafka-connect
    group_add:
      - "10000"
    ports:
      - "${KAFKA_CONNECT_PORT}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT}
      GROUP_ID: ${KAFKA_CONNECT_GROUP_ID}
      CONFIG_STORAGE_TOPIC: ${KAFKA_CONNECT_CONFIG_STORAGE_TOPIC}
      OFFSET_STORAGE_TOPIC: ${KAFKA_CONNECT_OFFSET_STORAGE_TOPIC}
      STATUS_STORAGE_TOPIC: ${KAFKA_CONNECT_STATUS_STORAGE_TOPIC}
    depends_on:
      service-tls:
        condition: service_completed_successfully
      vault-agent:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./connect-entrypoint.sh:/connect-entrypoint.sh:ro
      - service_tls:/tls:ro
      - kafka_secrets:/vault/secrets/kafka:ro
    entrypoint: ["sh", "/connect-entrypoint.sh"]
    networks:
      kafka_net:
      postgres_net:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  debezium-init:
    image: ${DEBEZIUM_INIT_IMAGE:?}
    container_name: debezium-init
    env_file:
      - ../.env
    volumes:
      - ./debezium/connector.outbox.json.tpl:/connector.outbox.json.tpl:ro
      - ./debezium/init.sh:/init.sh:ro
      - identity_postgresql_secrets:/vault/secrets/identity:ro
      - access_control_postgresql_secrets:/vault/secrets/access-control:ro
      - notification_postgresql_secrets:/vault/secrets/notification:ro
    depends_on:
      kafka-connect:
        condition: service_healthy
      postgres-haproxy:
        condition: service_healthy
      vault-agent:
        condition: service_healthy
    entrypoint: ["sh", "/init.sh"]
    networks:
      kafka_net:
      postgres_net:

volumes:
  kafka_data:
  identity_postgresql_secrets:
  access_control_postgresql_secrets:
  notification_postgresql_secrets:
  kafka_secrets:
  service_tls:
    name: ${DOCKER_VOLUME_SERVICE_TLS:?}

networks:
  kafka_net:
    external: true
    name: ${DOCKER_NETWORK_KAFKA}
  postgres_net:
    name: ${DOCKER_NETWORK_POSTGRES}
    internal: true
