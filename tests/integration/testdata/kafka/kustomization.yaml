apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaConnect
      name: kafka-connect
    patch: |-
      - op: replace
        path: /spec/build/output/image
        value: ${INTEGRATION_REGISTRY}:5000/monadiam/kafka-connect:3.6.1-final
