apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-repository-probe
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MonadIAM/infrastructure.git
    targetRevision: dev
    path: clusters/local
  destination:
    server: https://kubernetes.default.svc
    namespace: default
