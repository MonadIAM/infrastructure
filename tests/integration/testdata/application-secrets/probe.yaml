apiVersion: v1
kind: Secret
metadata:
  name: application-secret-probe-source
  namespace: monadiam-data
stringData:
  selected: initial
  excluded: must-stay-in-source
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: application-secret-probe
  namespace: monadiam-data
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [application-secret-probe-source]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: application-secret-probe
  namespace: monadiam-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: application-secret-probe
subjects:
  - kind: ServiceAccount
    name: application-secret-reader
    namespace: monadiam-apps
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application-secret-probe
  namespace: monadiam-apps
spec:
  refreshInterval: 5s
  secretStoreRef:
    kind: SecretStore
    name: kubernetes-data
  target:
    name: application-secret-probe
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: selected
      remoteRef:
        key: application-secret-probe-source
        property: selected
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-secret-probe
  namespace: monadiam-apps
  annotations:
    secret.reloader.stakater.com/reload: application-secret-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: application-secret-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-secret-probe
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: hashicorp/vault:2.0.3
          command: [sh, -ec, exec sleep 3600]
          env:
            - name: PROBE_VALUE
              valueFrom:
                secretKeyRef:
                  name: application-secret-probe
                  key: selected
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
