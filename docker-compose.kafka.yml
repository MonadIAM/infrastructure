x-base: &base
  restart: on-failure

services:
  kafka:
    <<: *base
    image: ${KAFKA_IMAGE:?}
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT},EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT},CONTROLLER://kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT},EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:?}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:?}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:?}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      kafka_net:
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: ${KAFKA_IMAGE:?}
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["bash", "/init-topics.sh"]
    networks:
      kafka_net:

  kafka-ui:
    <<: *base
    image: ${KAFKA_UI_IMAGE:?}
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_INTERNAL_PORT}
    networks:
      kafka_net:

  kafka-connect:
    <<: *base
    image: ${KAFKA_CONNECT_IMAGE:?}
    container_name: kafka-connect
    ports:
      - "${KAFKA_CONNECT_PORT}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT}
      GROUP_ID: ${KAFKA_CONNECT_GROUP_ID}
      CONFIG_STORAGE_TOPIC: ${KAFKA_CONNECT_CONFIG_STORAGE_TOPIC}
      OFFSET_STORAGE_TOPIC: ${KAFKA_CONNECT_OFFSET_STORAGE_TOPIC}
      STATUS_STORAGE_TOPIC: ${KAFKA_CONNECT_STATUS_STORAGE_TOPIC}
    depends_on:
      service-tls:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    volumes:
      - service_tls:/tls:ro
    networks:
      kafka_net:
      postgres_net:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  debezium-init:
    image: ${DEBEZIUM_INIT_IMAGE:?}
    container_name: debezium-init
    env_file:
      - .env
    volumes:
      - ./infrastructure/kafka/debezium/connector.outbox.json.tpl:/connector.outbox.json.tpl:ro
      - ./infrastructure/kafka/debezium/init.sh:/init.sh:ro
      - identity_postgresql_secrets:/vault/secrets/identity:ro
      - access_control_postgresql_secrets:/vault/secrets/access-control:ro
      - notification_postgresql_secrets:/vault/secrets/notification:ro
    depends_on:
      kafka-connect:
        condition: service_healthy
      postgres-haproxy:
        condition: service_healthy
      vault-agent:
        condition: service_healthy
    entrypoint: ["sh", "/init.sh"]
    networks:
      kafka_net:
      postgres_net:

volumes:
  kafka_data:
  identity_postgresql_secrets:
  access_control_postgresql_secrets:
  notification_postgresql_secrets:
  service_tls:
    name: ${DOCKER_VOLUME_SERVICE_TLS:?}

networks:
  kafka_net:
    external: true
    name: ${DOCKER_NETWORK_KAFKA}
  postgres_net:
    name: ${DOCKER_NETWORK_POSTGRES}
    internal: true
