apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: notification-service
  namespace: monadiam-apps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - monadiam-apps
              - monadiam-observability
              - istio-ingress
      to:
        - operation:
            ports:
              - "4003"
