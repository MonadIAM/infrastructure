apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hr-postgresql-ca
  namespace: monadiam-apps
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: kubernetes-data
  target:
    name: hr-postgresql-ca
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: hr-postgresql-ca
        property: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hr-kafka-ca
  namespace: monadiam-apps
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: kubernetes-messaging
  target:
    name: hr-kafka-ca
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: kafka-main-cluster-ca-cert
        property: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hr-kafka-auth
  namespace: monadiam-apps
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: kubernetes-messaging
  target:
    name: hr-kafka-auth
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: hr-service
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hr-vault-ca
  namespace: monadiam-apps
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: kubernetes-vault
  target:
    name: hr-vault-ca
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: vault-server-tls
        property: ca.crt
