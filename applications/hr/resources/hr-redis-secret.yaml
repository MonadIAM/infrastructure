apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hr-redis
  namespace: monadiam-apps
  labels:
    app.kubernetes.io/name: hr-service
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/component: application
spec:
  vaultAuthRef: hr-service
  mount: kv
  type: kv-v2
  path: monadiam-data/redis/hr/auth
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: hr-redis
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: hr-service
