apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: hr-http
  namespace: monadiam-apps
spec:
  host: hr-service.monadiam-apps.svc.cluster.local
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 4005
        connectionPool:
          http:
            idleTimeout: 60s
