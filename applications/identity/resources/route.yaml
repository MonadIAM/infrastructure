apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity-service
  namespace: monadiam-apps
spec:
  parentRefs:
    - name: public
      namespace: istio-ingress
      sectionName: identity
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/.well-known
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /.well-known
      backendRefs:
        - name: identity-service
          port: 4002
    - backendRefs:
        - name: identity-service
          port: 4002
