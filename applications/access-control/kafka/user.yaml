apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: access-control-service
  namespace: monadiam-messaging
  labels:
    app.kubernetes.io/name: access-control-service
    app.kubernetes.io/part-of: monadiam
    app.kubernetes.io/component: application
    strimzi.io/cluster: kafka-main
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: cluster
        operations:
          - Describe
          - IdempotentWrite
      - resource:
          type: group
          name: access-control-service-
          patternType: prefix
        operations:
          - Describe
          - Read
      - resource:
          type: topic
          name: account
          patternType: literal
        operations:
          - Describe
          - Read
      - resource:
          type: topic
          name: account-dead
          patternType: literal
        operations:
          - Describe
          - Write
      - resource:
          type: topic
          name: realm
          patternType: literal
        operations:
          - Describe
          - Read
      - resource:
          type: topic
          name: realm-dead
          patternType: literal
        operations:
          - Describe
          - Write
      - resource:
          type: topic
          name: projection-journal
          patternType: literal
        operations:
          - Describe
          - Read
      - resource:
          type: topic
          name: projection-journal-dead
          patternType: literal
        operations:
          - Describe
          - Write
      - resource:
          type: topic
          name: reauthentication
          patternType: literal
        operations:
          - Describe
          - Read
      - resource:
          type: topic
          name: reauthentication-dead
          patternType: literal
        operations:
          - Describe
          - Write
      - resource:
          type: topic
          name: blacklist
          patternType: literal
        operations:
          - Describe
          - Read
      - resource:
          type: topic
          name: blacklist-dead
          patternType: literal
        operations:
          - Describe
          - Write
