name: monadiam-zot

services:
  zot:
    image: ghcr.io/project-zot/zot:v2.1.23@sha256:9d3de83ac2099e6f4843045b4c9b65b7e8baf40f92d28f54906dee9d4d390fd7
    user: "65534:65534"
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    cgroup_parent: monadiam.slice
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5002:5000"
    networks:
      default:
        ipv4_address: 172.30.0.2
        aliases:
          - monadiam-registry
    volumes:
      - type: bind
        source: /var/lib/monadiam/zot/data
        target: /var/lib/registry
        bind:
          create_host_path: false
    configs:
      - source: zot
        target: /etc/zot/config.json
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

configs:
  zot:
    file: config.json

networks:
  default:
    name: monadiam-zot
    driver_opts:
      com.docker.network.bridge.trusted_host_interfaces: cni0
    ipam:
      config:
        - subnet: 172.30.0.0/24
